[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
pr-run-mode = "upload"
hosting = "github"
create-release = true
checksum = "sha256"
github-attestations = false
install-updater = false
tap = "choplin/homebrew-tap"
formula = "yomu"
publish-jobs = ["homebrew"]

