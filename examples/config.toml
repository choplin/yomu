# Copy this file to ${XDG_CONFIG_HOME:-$HOME/.config}/yomu/config.toml.
theme = "custom"

[view]
# Set to 0 to use the full terminal width.
max_width = 100

[graphics]
# One of: auto, kitty, sixel, text.
renderer = "auto"

[search]
# Smartcase ignores case unless the query contains an uppercase letter.
# One of: smart, sensitive, insensitive.
case = "smart"

[theme_overrides.palette]
# Config-local overrides are applied after the selected Theme.
accent = "#ff87d7"
