allow-branch = ["main"]
pre-release-commit-message = "chore: release {{crate_name}} {{version}}"
tag = true
tag-name = "v{{version}}"
tag-message = "Release {{crate_name}} {{version}}"
push = true
push-remote = "origin"
publish = true
verify = true

[[pre-release-replacements]]
file = "CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}"
exactly = 1
prerelease = true
