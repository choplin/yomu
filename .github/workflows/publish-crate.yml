name: Publish crate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to release
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Install the supported Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --no-self-update

      - name: Install cargo-release
        run: cargo +1.92.0 install cargo-release --version 1.1.6 --locked

      - name: Configure the release commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish, commit, tag, and push
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be a SemVer version" >&2
            exit 2
          fi
          cargo +1.92.0 release --execute --no-confirm -- "$VERSION"
