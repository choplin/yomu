name: Publish crate

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install the supported Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --no-self-update

      - name: Validate the tag and check crates.io
        id: crate
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$({ cargo +1.92.0 metadata --no-deps --format-version 1; } | jq --raw-output '.packages[] | select(.name == "yomu") | .version')"

          if [[ "$version" != "$manifest_version" ]]; then
            echo "tag version $version does not match Cargo.toml version $manifest_version" >&2
            exit 2
          fi

          status="$({ curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent "yomu-release/${GITHUB_RUN_ID}" \
            "https://crates.io/api/v1/crates/yomu/$version"; })"

          case "$status" in
            200)
              echo "yomu $version is already published; skipping crates.io publication"
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unexpected crates.io response: HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Authenticate with crates.io
        if: steps.crate.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.92.0 publish --locked
