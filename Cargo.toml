[package]
name = "raden"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
fontdue = { version = "=0.9.3", default-features = false, features = ["std"] }
fontdb = "0.23"
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
icy_sixel = "=0.5.1"
percent-encoding = "2.3"
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
resvg = { version = "=0.47.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
tex2typst-rs = "=0.4.1"
toml = "0.9"
typst = "=0.15.0"
typst-as-lib = "=0.16.0"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-svg = "=0.15.0"
unicode-width = "0.2"
