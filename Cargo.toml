[package]
name = "raden"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
unicode-width = "0.2"
